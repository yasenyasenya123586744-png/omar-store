<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; }</style>
</head>
<body>
    <nav class="p-6 border-b border-white/5"><a href="index.html" class="text-yellow-500 font-black">OMAR STORE</a></nav>

    <div class="container mx-auto py-20 px-6">
        <div class="flex flex-col md:flex-row gap-12 bg-[#0a0a0a] p-10 rounded-[40px] border border-white/5">
            <div class="md:w-1/2 bg-black p-10 rounded-3xl">
                <img id="mainImg" src="" class="w-full h-80 object-contain">
            </div>
            <div class="md:w-1/2">
                <h1 id="prodName" class="text-5xl font-black mb-6 italic text-yellow-500">جاري التحميل...</h1>
                <p class="text-gray-400 text-lg mb-8">هذا المنتج أصلي ومضمون 100% من متجر عمر استور .</p>
                <div class="text-4xl font-black mb-10"><span id="prodPrice">0</span> ج.م</div>
                <a href="checkout.html" class="block text-center bg-white text-black py-5 rounded-2xl font-black text-xl hover:bg-yellow-500 transition">إتمام عملية الشراء</a>
            </div>
        </div>
    </div>

    <script>
        // الكود اللي بيغير المحتوى حسب المنتج اللي ضغطت عليه
        window.onload = function() {
            const name = localStorage.getItem('selectedProduct');
            const price = localStorage.getItem('selectedPrice');
            const imgFile = localStorage.getItem('selectedImg');

            if (name && price) {
                document.getElementById('prodName').innerText = name;
                document.getElementById('prodPrice').innerText = price;
                
                // استخدام الصورة من localStorage (التي تأتي من index.html)
                const img = document.getElementById('mainImg');
                if (imgFile) {
                    img.src = imgFile;
                    img.onerror = function() {
                        // صورة احتياطية في حالة عدم وجود الصورة
                        img.src = "https://via.placeholder.com/300/111/eab308?text=OMAR+STORE";
                    };
                }
            }
        };
    </script>
</body>
</html>
